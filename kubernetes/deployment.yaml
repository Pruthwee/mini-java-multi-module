apiVersion: apps/v1
kind: Deployment
metadata:
  name: minijava-ui
  namespace: "{{NAMESPACE}}"
  labels:
    app: minijava-ui
spec:
  replicas: 2
  selector:
    matchLabels:
      app: minijava-ui
  template:
    metadata:
      labels:
        app: minijava-ui
    spec:
      containers:
        - name: minijava-ui
          image: "{{IMAGE_URI}}"
          ports:
            - containerPort: 8080
          env:
            - name: APP_PORT
              value: "{{APP_PORT}}"
            - name: CORS_ORIGIN
              value: "{{CORS_ORIGIN}}"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "500m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
