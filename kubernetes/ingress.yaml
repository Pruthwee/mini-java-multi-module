apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: minijava-ui-ingress
  namespace: minijava-ui
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
spec:
  rules:
    - host: minijava-ui.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: minijava-ui-service
                port:
                  number: 80
