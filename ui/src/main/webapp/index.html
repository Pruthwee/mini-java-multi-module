<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MiniJava-UI · UI Transformation Playground</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div>
      <h1>MiniJava-UI</h1>
      <p class="tagline">Build a UI, then watch both modules transform it.</p>
    </div>
    <div class="modules" aria-label="Application modules">
      <span class="chip ok">ui module</span>
      <span class="chip" id="backendChip">backend module</span>
    </div>
  </header>

  <main id="app" class="layout"></main>

  <footer class="app-footer">
    <span>MiniJava-UI · ui module and backend module deploy separately</span>
  </footer>

  <script src="js/config.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
